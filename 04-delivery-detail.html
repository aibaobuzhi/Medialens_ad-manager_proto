<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery · Momenta HK IPO — MediaLens</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Noto+Sans+HK:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#23A9F6; --blue-tint:#EEF6FF;
  --title:#0A1F2C; --text:#102532; --regular:#707070; --secondary:#828282; --placeholder:#CACACA;
  --white:#fff; --page:#F7F7F7; --disabled:#F5F5F5; --ai:#F6F8FD;
  --border:#D9E3E6; --divider:#E8EEF0;
  --danger:#FF3F41; --success-l:#E6FBEB; --warning-l:#FFF8EB;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Poppins','Noto Sans HK',system-ui,-apple-system,sans-serif;background:var(--page);
  color:var(--text);font-size:14px;line-height:22px;-webkit-font-smoothing:antialiased;padding-bottom:66px}
button{font-family:inherit;cursor:pointer;border:none;background:none}

.top{position:sticky;top:0;z-index:50;background:var(--white);border-bottom:1px solid var(--divider);
  padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;color:var(--regular);
  padding:6px 10px;border-radius:8px}
.back:hover{background:var(--page);color:var(--blue)}
.top__t{min-width:0}
.top__t h1{font-size:16px;font-weight:600;line-height:24px;color:var(--title);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.top__t .sub{font-size:12px;line-height:18px;color:var(--secondary);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.top__a{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:10px;
  font-size:12px;font-weight:500;line-height:20px;background:var(--page);color:var(--regular)}
.chip--blue{background:var(--blue-tint);color:var(--blue)}
.chip--warn{background:var(--warning-l);color:#9A6B00}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--white);
  font-size:13px;font-weight:500;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn--primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn--primary:hover{background:#1B96DE;border-color:#1B96DE;color:#fff}
.btn--sm{height:28px;padding:0 11px;font-size:12px;border-radius:6px}
.btn--text{border-color:transparent;color:var(--blue)}
.btn--text:hover{background:var(--blue-tint)}

.wrap{max-width:1200px;margin:0 auto;padding:22px 24px 0}
.sec{margin-bottom:26px}
.sec__h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec__h h2{font-size:15px;font-weight:600;line-height:23px;color:var(--title)}
.sec__h .r{margin-left:auto}

.pkg{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:18px;
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px}
.lbl{font-size:12px;font-weight:600;line-height:18px;color:var(--title);margin-bottom:6px}
.article{border:1px solid var(--border);border-radius:8px;background:#fff;padding:12px 14px;
  max-height:300px;overflow-y:auto;font-family:'Noto Sans HK','Poppins',sans-serif;
  font-size:13px;line-height:21px;color:var(--text)}
.article p{margin:0 0 11px}
.article p:last-child{margin:0}
.article::-webkit-scrollbar{width:6px}
.article::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

.assets{display:flex;flex-wrap:wrap;gap:10px}
.asset{width:92px}
.asset__t{width:92px;aspect-ratio:4/5;border:1px solid var(--divider);border-radius:7px;overflow:hidden;
  background:var(--disabled);cursor:zoom-in;position:relative}
.asset__t:hover{border-color:var(--blue)}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:5px;background:linear-gradient(160deg,#EAF3FB,#D8E8F5);color:#5B7C99;font-size:10px;line-height:14px;
  text-align:center;padding:6px}
.ph b{font-size:16px;line-height:18px;color:#2E6DA4}
.asset__m{margin-top:5px}
.asset__m b{display:block;font-size:11px;font-weight:500;line-height:15px;color:var(--title);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset__m span{display:block;font-size:11px;line-height:15px;color:var(--secondary)}
.asset__m span.alt{color:#9A6B00}
.srcs{margin-top:14px;padding:9px 11px;border-radius:8px;background:var(--ai);
  font-size:12px;line-height:18px;color:var(--regular);display:flex;gap:8px;align-items:center;cursor:pointer}
.srcs b{color:var(--title);font-weight:600}
.srcs u{margin-left:auto;color:var(--blue);text-decoration:none;white-space:nowrap}
.srclist{margin-top:6px;padding:9px 12px;border:1px solid var(--divider);border-radius:8px;
  font-size:12px;line-height:19px;color:var(--regular)}

/* post cards：与 Content Publish 的 publish-card 同一套 */
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:16px;align-items:start}
.card{position:relative;background:var(--white);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;display:flex;flex-direction:column}
.card__badge{position:absolute;top:11px;right:11px;z-index:2;height:22px;padding:0 10px;border-radius:11px;
  background:rgba(10,31,44,.62);color:#fff;font-size:12px;font-weight:500;line-height:22px}
.card__head{display:flex;gap:10px;align-items:flex-start;padding:12px 12px 0}
.avatar{width:38px;height:38px;border-radius:50%;flex:0 0 38px;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:700;color:#fff;letter-spacing:.4px}
.av-fb{background:#0A1F2C}.av-ig{background:linear-gradient(135deg,#F58529,#DD2A7B,#8134AF)}
.av-web{background:#65676B}
.card__meta{min-width:0;flex:1}
.card__acct{display:flex;align-items:center;gap:5px;font-size:13px;line-height:19px;color:var(--regular)}
.card__acct i{font-size:13px;line-height:1;font-style:normal}
.i-fb{color:#1877F2}.i-ig{color:#C13584}.i-web{color:#65676B}
.card__time{font-size:12px;line-height:18px;color:var(--secondary)}
.card__marks{display:flex;align-items:center;gap:6px;margin-top:3px}
.mark{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center}
.mtype{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;line-height:20px;color:var(--regular)}
.mtype i{color:var(--blue);font-style:normal;font-size:13px}
.card__capw{padding:10px 12px 0}
.card__cap{font-family:'Noto Sans HK','Poppins',sans-serif;font-size:13px;line-height:20px;color:var(--text);
  white-space:pre-wrap}
.card__cap.is-clamped{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.card__more{font-size:13px;line-height:20px;color:var(--blue);padding:2px 0 0}
.card__media{margin:10px 0 0}
.card__acts{padding:11px 12px;display:flex;gap:8px;align-items:center;margin-top:auto}

.m-img{width:100%;aspect-ratio:4/5;background:linear-gradient(160deg,#EAF3FB,#D8E8F5);position:relative}
.m-img.wide{aspect-ratio:1.91/1}
.m-img .lab{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#5B7C99;font-size:11px}
.m-linkph{margin:0 12px;padding:20px 16px;text-align:center;background:#FAFBFC;
  border:1px dashed var(--border);border-radius:8px}
.m-linkph .ic{font-size:19px;line-height:1;color:var(--blue);display:block;margin-bottom:6px}
.m-linkph b{display:block;font-size:13px;font-weight:600;line-height:19px;color:var(--title);margin-bottom:4px}
.m-linkph span{display:block;font-size:12px;line-height:18px;color:var(--secondary)}
.m-art{margin:0 12px;border:1px solid var(--divider);border-radius:8px;overflow:hidden}
.m-art__chrome{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;background:#F0F3F5;
  border-bottom:1px solid var(--divider)}
.m-art__chrome i{width:7px;height:7px;border-radius:50%;background:var(--placeholder);display:block}
.m-art__url{flex:1;height:16px;line-height:16px;padding:0 8px;border-radius:8px;background:#fff;
  font-size:11px;color:var(--secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-art__hero{width:100%;aspect-ratio:1.91/1;background:linear-gradient(160deg,#EAF3FB,#D8E8F5)}
.m-art__b{padding:10px 12px 12px}
.m-art__b h4{margin:0 0 6px;font-size:14px;font-weight:600;line-height:20px;color:var(--title)}
.m-art__b p{margin:0;font-size:13px;line-height:19px;color:var(--regular);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dep{margin:10px 12px 0;padding:7px 9px;border-radius:7px;background:var(--warning-l);color:#8A5F00;
  font-size:11px;line-height:17px}
.dep--first{background:var(--blue-tint);color:#0A6E9E}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--white);
  border-top:1px solid var(--divider);padding:11px 24px;display:flex;align-items:center;gap:12px;
  box-shadow:0 -2px 12px rgba(16,37,50,.06)}
.bar__i{font-size:12px;line-height:18px;color:var(--regular)}
.bar__i b{color:var(--title);font-weight:600}
.bar__a{margin-left:auto;display:flex;gap:8px}

.mask{position:fixed;inset:0;z-index:200;background:rgba(10,31,44,.6);display:flex;align-items:center;
  justify-content:center;padding:24px}
.share{background:#fff;border-radius:12px;max-width:520px;width:100%;overflow:hidden}
.share__h{padding:15px 18px;border-bottom:1px solid var(--divider);font-size:15px;font-weight:600;color:var(--title)}
.share__b{padding:16px 18px}
.share__b p{font-size:12px;line-height:19px;color:var(--regular);margin-bottom:11px}
.share__link{display:flex;gap:8px}
.share__link input{flex:1;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 11px;
  font-family:inherit;font-size:12px;color:var(--text);background:var(--page)}
.lb__box{background:#fff;border-radius:12px;overflow:hidden;max-width:min(520px,92vw)}
.lb__img{background:var(--title);min-height:280px;display:flex;align-items:center;justify-content:center;
  color:#8FB8D8;font-size:13px}
.lb__bar{display:flex;align-items:center;gap:10px;padding:12px 15px}
.lb__bar b{display:block;font-size:13px;font-weight:600;color:var(--title)}
.lb__bar span{display:block;font-size:12px;color:var(--secondary)}
.lb__bar .r{margin-left:auto}
@media(max-width:900px){.pkg{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="top">
  <button class="back" id="back">‹ Back</button>
  <div class="top__t">
    <h1>2026-08-11 · Momenta 擬香港 IPO：下一隻 AI 新股係咪真係賺到錢？</h1>
    <div class="sub">
      <span class="chip chip--blue">v2</span>
      <span class="chip chip--warn">Pending review · 4</span>
      <span>BF agent · Julie Li</span>
      <a href="#" style="color:var(--blue);text-decoration:none">Version history (2)</a>
    </div>
  </div>
  <div class="top__a">
    <button class="btn" id="share">Copy link</button>
    <button class="btn btn--primary">Confirm &amp; Publish</button>
  </div>
</div>

<div class="wrap">
  <section class="sec">
    <div class="sec__h"><h2>Delivery</h2></div>
    <div class="pkg">
      <div>
        <div class="lbl">Caption</div>
        <div class="article" id="article"></div>
      </div>
      <div>
        <div class="lbl">Media</div>
        <div class="assets" id="assets"></div>
        <div class="srcs" id="srcs">
          <div><b>Verified sources · 6</b></div>
          <u id="srcsT">View</u>
        </div>
        <div id="srclist"></div>
      </div>
    </div>
  </section>

  <section class="sec">
    <div class="sec__h"><h2>4 posts</h2><span class="r chip">One delivery</span></div>
    <div class="posts" id="posts"></div>
  </section>
</div>

<div class="bar">
  <span class="bar__i"><b>4 ready to publish</b> · Order: Website Article → Facebook Link · IG Carousel &amp; FB Image in parallel</span>
  <div class="bar__a">
    <button class="btn" id="share2">Copy link</button>
    <button class="btn btn--primary">Confirm &amp; Publish</button>
  </div>
</div>

<script>
var ARTICLE = [
 'Momenta擬港籌10億美元！中國自動駕駛AI新股光環背後 三年蝕逾92億問盈利何時到？【 @businessfocus.io 】【#BF社會熱話】',
 '中國自動駕駛獨角獸 Momenta Global Limited 擬在香港 IPO，據報最快下周啟動招股，集資額或約 10 億美元（約合78億港元），估值約 90 億美元（約702億港元）。這宗交易之所以受市場注目，不只是因為通用汽車（美股：GM）、豐田汽車（日股：7203）、上汽集團（A股：600104）等車企在股東或合作方名單中出現，更因為它正好踩中港股市場最想聽、也最需要驗證的故事：下一隻 AI 新股，到底是科技重估，還是又一次用未來燒錢？',
 '車企背書夠豪華 但港股要看的不是名單',
 'Momenta 主打自動駕駛及高階輔助駕駛方案，招股文件披露，2025 年收入增至人民幣 24.13 億元，毛利率升至 71.6%；截至 2025 年底，量產車方案安裝量超過 68 萬套。',
 '收入增長快 虧損曲線仍是最大陰影',
 '招股文件披露，Momenta 2023 至 2025 年年度虧損分別為人民幣 25.70 億元、32.06 億元及 34.58 億元，三年合計逾人民幣 92 億元。非 IFRS 經調整虧損已收窄至 2025 年人民幣 3.03 億元，但市場真正要問的是，這種改善究竟來自商業模式成熟，還是會被下一輪研發與 Robotaxi 擴張再次吞噬。'
];

var ASSETS = [
  {n:'02_直版封面',        r:'4:5',      t:'封面'},
  {n:'03_資訊圖1_事件拆解', r:'4:5',      t:'事件拆解'},
  {n:'04_資訊圖2_痛點分析', r:'4:5',      t:'痛點分析'},
  {n:'05_資訊圖3_解法重點', r:'4:5',      t:'解法重點'},
  {n:'06_資訊圖4_CTA',     r:'4:5',      t:'CTA'},
  {n:'07_橫版封面',        r:'1000×525', t:'橫版 hero', alt:true}
];

var SRCS = ['HKEXnews：Momenta Global Limited Post Hearing Information Pack',
  '中國證監會：境外發行上市備案通知書',
  'Reuters / The Edge Malaysia：招股、集資及估值報道',
  'CnEVPost：通過聆訊、收入、虧損、車企合作及搭載量',
  'Bamboo Works：通過聆訊及財務概要',
  'Momenta 官方資料：一個飛輪、兩條腿策略'];

var POSTS = [
 { plat:'Website article', acct:'businessfocus.io', av:'av-web', avT:'W', ic:'i-web', icT:'🌐',
   time:'2026-08-11 00:42', mark:'article',
   cap:'Momenta擬港籌10億美元！中國自動駕駛AI新股光環背後 三年蝕逾92億問盈利何時到？',
   media:'article', first:true },
 { plat:'Facebook', acct:'BusinessFocus', av:'av-fb', avT:'BF', ic:'i-fb', icT:'f',
   time:'2026-08-11 00:42', mark:'link',
   cap:'下一隻AI新股來了？自動駕駛獨角獸Momenta據報擬在香港IPO，集資約10億美元，背後有通用、豐田、上汽等車企支持。不過，光環背後是高燒錢模式：收入增長快，但三年累虧逾92億元。\n\n全文詳見➡️：https://businessfocus.io/article/358299',
   media:'link', dep:true },
 { plat:'Instagram', acct:'businessfocus.io', av:'av-ig', avT:'IG', ic:'i-ig', icT:'◎',
   time:'2026-08-11 00:42', mark:'album', markT:'5',
   cap:'下一隻AI新股來了？Momenta 擬港籌 10 億美元。\n三年蝕逾 92 億，AI 故事幾時先賺到錢？\n\n#BusinessFocus #Momenta #香港IPO #自動駕駛',
   media:'carousel' },
 { plat:'Facebook', acct:'BusinessFocus', av:'av-fb', avT:'BF', ic:'i-fb', icT:'f',
   time:'2026-08-11 00:42', mark:'image',
   cap:'三年燒錢 92 億，Momenta 擬港籌 10 億美元。港股敢唔敢接下一隻 AI 新股？',
   media:'image' }
];

document.getElementById('article').innerHTML = ARTICLE.map(function(t){ return '<p>'+t+'</p>'; }).join('');

document.getElementById('assets').innerHTML = ASSETS.map(function(a,i){
  return '<div class="asset"><div class="asset__t" data-i="'+i+'">'
    + '<div class="ph"><b>'+(i+2)+'</b>'+a.t+'</div></div>'
    + '<div class="asset__m"><b title="'+a.n+'">'+a.n+'</b>'
    + '<span'+(a.alt?' class="alt"':'')+'>'+a.r+'</span></div></div>';
}).join('');

var srcOpen=false;
function paintSrcs(){
  document.getElementById('srclist').innerHTML = srcOpen
    ? '<div class="srclist">'+SRCS.map(function(s,i){return '<div>'+(i+1)+'. '+s+'</div>';}).join('')+'</div>' : '';
  document.getElementById('srcsT').textContent = srcOpen ? 'Hide' : 'View';
}
document.getElementById('srcs').onclick=function(){ srcOpen=!srcOpen; paintSrcs(); };
paintSrcs();

function media(p){
  if(p.media==='article'){
    return '<div class="m-art">'
      + '<div class="m-art__chrome"><i></i><i></i><i></i><span class="m-art__url">businessfocus.io/article/…</span></div>'
      + '<div class="m-art__hero"></div>'
      + '<div class="m-art__b"><h4>Momenta擬香港IPO籌10億美元：自動駕駛AI新股能否真正賺錢？</h4>'
      + '<p>中國自動駕駛獨角獸 Momenta 擬在香港 IPO，據報最快下周啟動招股。市場關注的並非單一選角，而是估值是否已提前反映未來十年的想像。</p></div></div>';
  }
  if(p.media==='link'){
    return '<div class="m-linkph"><span class="ic">🔗</span>'
      + '<b>Link preview — generated by Meta</b>'
      + '<span>Meta pulls the cover image, title and domain from this link’s Open Graph tags when the post goes live.</span></div>';
  }
  if(p.media==='carousel') return '<div class="m-img"><span class="lab">02_直版封面 · 4:5</span></div>';
  return '<div class="m-img wide"><span class="lab">07_橫版封面 · 1000×525</span></div>';
}

function markHTML(p){
  if(p.mark==='album')   return '<span class="mtype"><i>⧉</i>'+p.markT+'</span>';
  if(p.mark==='link')    return '<span class="mtype"><i>🔗</i></span>';
  if(p.mark==='article') return '<span class="mtype"><i>📄</i></span>';
  return '<span class="mtype"><i>▣</i></span>';
}

document.getElementById('posts').innerHTML = POSTS.map(function(p,i){
  return '<article class="card">'
    + '<span class="card__badge">Draft</span>'
    + '<header class="card__head"><span class="avatar '+p.av+'">'+p.avT+'</span>'
      + '<div class="card__meta">'
        + '<div class="card__acct"><i class="'+p.ic+'">'+p.icT+'</i>'+p.acct+'</div>'
        + '<div class="card__time">'+p.time+'</div>'
        + '<div class="card__marks"><span class="mark">✦</span>'+markHTML(p)+'</div>'
      + '</div></header>'
    + '<div class="card__capw"><p class="card__cap is-clamped" data-i="'+i+'">'+p.cap+'</p>'
      + '<button class="card__more" data-more="'+i+'">See more…</button></div>'
    + '<div class="card__media">'+media(p)+'</div>'
    + (p.dep ? '<div class="dep">Waits for the article URL to go live.</div>' : '')
    + (p.first ? '<div class="dep dep--first">Publish this first.</div>' : '')
    + '<footer class="card__acts"><button class="btn btn--sm">Edit</button>'
      + '<button class="btn btn--sm btn--primary">Publish</button>'
      + '<button class="btn btn--sm btn--text">Delete</button></footer>'
  + '</article>';
}).join('');

document.querySelectorAll('[data-more]').forEach(function(b){
  var cap = document.querySelector('.card__cap[data-i="'+b.dataset.more+'"]');
  var lh = parseFloat(getComputedStyle(cap).lineHeight) || 20;
  cap.classList.remove('is-clamped');
  var full = cap.scrollHeight;
  cap.classList.add('is-clamped');
  if(full <= lh*5 + 2){ b.style.display='none'; return; }
  b.onclick = function(){
    var on = cap.classList.toggle('is-clamped');
    b.textContent = on ? 'See more…' : 'See less';
  };
});

document.getElementById('assets').onclick=function(e){
  var t=e.target.closest('.asset__t'); if(!t) return;
  var a=ASSETS[+t.dataset.i];
  var m=document.createElement('div'); m.className='mask';
  m.innerHTML='<div class="lb__box"><div class="lb__img">'+a.n+'</div>'
    +'<div class="lb__bar"><div><b>'+a.n+'</b><span>'+a.r+'</span></div>'
    +'<button class="btn btn--sm r">@ Reference this image</button></div></div>';
  m.onclick=function(ev){ if(ev.target===m||ev.target.classList.contains('btn')) m.remove(); };
  document.body.appendChild(m);
};

function openShare(){
  var m=document.createElement('div'); m.className='mask';
  m.innerHTML='<div class="share"><div class="share__h">Copy link</div>'
    +'<div class="share__b"><p>This link points to the delivery folder and always shows the latest version. '
    +'Your leader opens it with their own MediaLens account.</p>'
    +'<div class="share__link"><input readonly value="https://app.medialens.io/org/jkay0l8p/delivery/bf-20260811-momenta"><button class="btn btn--primary">Copy</button></div></div></div>';
  m.onclick=function(ev){ if(ev.target===m||ev.target.tagName==='BUTTON') m.remove(); };
  document.body.appendChild(m);
}
document.getElementById('share').onclick=openShare;
document.getElementById('share2').onclick=openShare;
