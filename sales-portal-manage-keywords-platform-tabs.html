<style id=proto-style>
.proto-tabs{display:flex;gap:8px;margin:0 0 14px;border-bottom:1px solid #e4e7ed}
.proto-tab{appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:8px 18px;font-size:14px;line-height:22px;color:#606266;cursor:pointer;font-family:inherit}
.proto-tab:hover{color:#409eff}
.proto-tab.active{color:#409eff;border-bottom-color:#409eff;font-weight:600}
.proto-pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:12px;line-height:20px;border:1px solid transparent}
.proto-pill.xhs{color:#d4380d;background:#fff2e8;border-color:#ffbb96}
.proto-pill.threads{color:#1d1d1f;background:#f2f3f5;border-color:#d9dade}
.proto-empty{padding:34px 0;text-align:center;color:#909399;font-size:14px}
.proto-row-actions{position:relative}
.proto-menu{position:absolute;right:0;top:20px;z-index:60;background:#fff;border:1px solid #ebeef5;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.1);min-width:110px;padding:4px 0}
.proto-menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 16px;font-size:13px;color:#606266;cursor:pointer;font-family:inherit}
.proto-menu button:hover{background:#f5f7fa;color:#409eff}
.proto-menu button.danger:hover{color:#f56c6c}
.proto-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:2100;overflow:auto;padding:40px 16px}
.proto-mask.open{display:flex}
.proto-modal{background:#fafbfc;border-radius:6px;width:1000px;max-width:100%;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.proto-modal .hd{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:#fff;border-radius:6px 6px 0 0;border-bottom:1px solid #ebeef5}
.proto-modal .hd h4{margin:0;font-size:17px;font-weight:600;color:#303133}
.proto-modal .hd .x{background:none;border:0;font-size:20px;color:#909399;cursor:pointer;line-height:1}
.proto-modal .bd{padding:28px 32px}
.proto-fi{display:flex;align-items:flex-start;margin-bottom:22px}
.proto-fi>label{width:150px;flex:none;text-align:right;padding-right:12px;font-size:14px;color:#606266;line-height:40px}
.proto-fi>.ct{flex:1;min-width:0}
.proto-fi input[type=text],.proto-fi select{height:40px;line-height:40px;border:1px solid #dcdfe6;border-radius:4px;padding:0 12px;font-size:14px;color:#606266;background:#fff;font-family:inherit;box-sizing:border-box}
.proto-fi input[type=text]{width:100%}
.proto-fi select{width:220px}
.proto-num{display:inline-flex;border:1px solid #dcdfe6;border-radius:4px;overflow:hidden;background:#fff}
.proto-num button{width:40px;height:38px;background:#f5f7fa;border:0;border-right:1px solid #dcdfe6;color:#606266;font-size:15px;cursor:pointer}
.proto-num button:last-child{border-right:0;border-left:1px solid #dcdfe6}
.proto-num button:disabled{color:#c0c4cc;cursor:not-allowed}
.proto-num input{width:110px;height:38px;border:0;text-align:center;font-size:14px;color:#606266;font-family:inherit}
.proto-switch{width:44px;height:22px;border-radius:11px;background:#dcdfe6;position:relative;cursor:pointer;border:0;padding:0;margin-top:9px;display:block}
.proto-switch:after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .18s}
.proto-switch.on{background:#409eff}
.proto-switch.on:after{left:24px}
.proto-err{color:#f56c6c;font-size:12px;line-height:18px;padding-top:4px}
.proto-ft{padding:4px 32px 28px 182px}
.proto-ft .el-button{margin-right:10px}
.proto-confirm .proto-modal{width:440px}
.proto-confirm .bd{font-size:14px;color:#606266;line-height:22px}
.proto-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#edf2fc;border:1px solid #ebeef5;color:#606266;padding:11px 20px;border-radius:4px;font-size:14px;z-index:3000;box-shadow:0 2px 12px rgba(0,0,0,.1);display:none}
.proto-toast.err{background:#fef0f0;border-color:#fde2e2;color:#f56c6c}
.proto-toast.show{display:block}
.el-table__body-wrapper{overflow:visible}
</style>

         +'<td rowspan=1 colspan=1 class=el-table_4_column_27><div class=cell><span>'+esc(d.schedulingTime)+'</span></div>'
         +'<td rowspan=1 colspan=1 class=el-table_4_column_28><div class=cell><span>'+esc(d.status)+'</span></div>'
         +'<td rowspan=1 colspan=1 class=el-table_4_column_29><div class=cell><span>'+esc(d.lastCrawledAt||'--')+'</span></div>'
         +'<td rowspan=1 colspan=1 class=el-table_4_column_30><div class=cell><span>'+esc(d.createdAt)+'</span></div>'
         +'<td rowspan=1 colspan=1 class="el-table_4_column_31 result-col-icon"><div class=cell><div class=proto-row-actions>'
         +'<button type=button class=proto-dots aria-label="Row actions" aria-haspopup=menu style="background:none;border:0;cursor:pointer;padding:2px 6px;color:#909399;font-size:15px;line-height:1">&#8942;</button>'
         +'</div></div>';
      }).join('');
    }
    $('#kw-total').textContent=list.length;
    renderPager(pages);
  }

  function renderPager(pages){
    var ul=$('.el-pager'); if(!ul) return;
    var html='';
    for(var i=1;i<=pages;i++){ html+='<li class="number'+(i===page?' active':'')+'" data-page="'+i+'">'+i+'</li>'; }
    ul.innerHTML=html;
    var prev=$('.btn-prev'), next=$('.btn-next');
    if(prev) prev.disabled = page<=1;
    if(next) next.disabled = page>=pages;
  }

  document.addEventListener('click',function(e){
    var li=e.target.closest('.el-pager li.number');
    if(li){ page=Number(li.dataset.page); render(); return; }
    if(e.target.closest('.btn-prev')){ if(page>1){page--; render();} return; }
    if(e.target.closest('.btn-next')){ var pages=Math.max(1,Math.ceil(rows().length/perPage)); if(page<pages){page++; render();} return; }
  });

  /* ---------- tabs ---------- */
  $$('.proto-tab').forEach(function(b){
    b.addEventListener('click',function(){
      if(platform===b.dataset.platform) return;
      platform=b.dataset.platform; page=1;
      $$('.proto-tab').forEach(function(x){ var on=x===b; x.classList.toggle('active',on); x.setAttribute('aria-selected',on?'true':'false'); });
      closeMenus(); render();
    });
  });

  /* ---------- row menu ---------- */
  function closeMenus(){ $$('.proto-menu').forEach(function(m){ m.remove(); }); }
  document.addEventListener('click',function(e){
    var dots=e.target.closest('.proto-dots');
    if(!dots){ if(!e.target.closest('.proto-menu')) closeMenus(); return; }
    var host=dots.parentNode;
    var open=host.querySelector('.proto-menu');
    closeMenus();
    if(open) return;
    var id=dots.closest('tr').dataset.id;
    var m=document.createElement('div');
    m.className='proto-menu'; m.setAttribute('role','menu');
    m.innerHTML='<button type=button role=menuitem data-act=edit>Edit</button><button type=button role=menuitem class=danger data-act=delete>Delete</button>';
    host.appendChild(m);
    m.addEventListener('click',function(ev){
      var act=ev.target.dataset.act; if(!act) return;
      closeMenus();
      if(act==='edit') openModal(id); else askDelete(id);
    });
  });

  /* ---------- modal ---------- */
  function setNum(id,v){ $('#'+id).value=String(v); }
  function getNum(id){ var n=parseInt($('#'+id).value,10); return isNaN(n)?0:Math.max(0,n); }
  function setSwitch(on){
    var sw=$('#f-comment-enabled');
    sw.classList.toggle('on',on); sw.setAttribute('aria-checked',on?'true':'false');
    $('#f-comment-count').disabled=!on;
    $$('#f-comment-count-wrap button').forEach(function(b){ b.disabled=!on; });
  }
  function fieldErr(id,msg){
    var e=$('#e-'+id); if(!e) return;
    e.textContent=msg||''; e.style.display=msg?'':'none';
  }

  function openModal(id){
    editingId=id||null;
    var d = id ? DATA.filter(function(x){return x.id===id;})[0] : null;
    $('#kw-modal-title').textContent = id ? 'Edit Keyword' : 'Add Keyword';
    $('#f-keyword').value = d?d.keyword:'';
    $('#f-alias').value = d?d.alias:'';
    $('#f-platform').value = d?d.platform:platform;
    setNum('f-count', d?d.count:0);
    $('#f-status').value = d?d.status:'active';
    $('#f-frequency').value = d?d.frequency:'daily';
    setNum('f-scheduling', d?d.schedulingTime:1);
    setSwitch(d?!!d.isCommentEnabled:false);
    setNum('f-comment-count', d?d.commentCount:0);
    fieldErr('keyword',null); fieldErr('platform',null);
    $('#kw-mask').classList.add('open');
    setTimeout(function(){ $('#f-keyword').focus(); },30);
  }
  function closeModal(){ $('#kw-mask').classList.remove('open'); editingId=null; }

  $$('.proto-num button').forEach(function(b){
    b.addEventListener('click',function(){
      var inp=$('#'+b.dataset.target); if(inp.disabled) return;
      var n=parseInt(inp.value,10); if(isNaN(n)) n=0;
      n+=Number(b.dataset.step); if(n<0) n=0;
      inp.value=String(n);
    });
  });
  $('#f-comment-enabled').addEventListener('click',function(){ setSwitch(!this.classList.contains('on')); });
  $('#kw-x').addEventListener('click',closeModal);
  $('#kw-cancel').addEventListener('click',closeModal);
  $('#kw-mask').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
  $('#btn-add-keyword').addEventListener('click',function(){ openModal(null); });

  $('#kw-save').addEventListener('click',function(){
    var kw=$('#f-keyword').value.trim();
    var pf=$('#f-platform').value;
    if(!kw){ fieldErr('keyword','Keyword is required.'); $('#f-keyword').focus(); return; }
    fieldErr('keyword',null);
    var dup=DATA.some(function(d){ return d.platform===pf && d.keyword.toLowerCase()===kw.toLowerCase() && d.id!==editingId; });
    if(dup){ fieldErr('keyword','This keyword already exists on '+pf+'.'); return; }
    var on=$('#f-comment-enabled').classList.contains('on');
    var patch={ keyword:kw, alias:$('#f-alias').value.trim(), platform:pf, count:getNum('f-count'),
      status:$('#f-status').value, frequency:$('#f-frequency').value, schedulingTime:getNum('f-scheduling'),
      isCommentEnabled:on, commentCount:on?getNum('f-comment-count'):0 };
    if(editingId){
      var d=DATA.filter(function(x){return x.id===editingId;})[0];
      var moved = d.platform!==pf;
      Object.keys(patch).forEach(function(k){ d[k]=patch[k]; });
      closeModal();
      if(moved){ platform=pf; page=1;
        $$('.proto-tab').forEach(function(x){ var on2=x.dataset.platform===pf; x.classList.toggle('active',on2); x.setAttribute('aria-selected',on2?'true':'false'); });
        render(); toast('Update keyword success — moved to '+pf+' tab');
      } else { render(); toast('Update keyword success'); }
    } else {
      patch.id='kw'+(seq++);
      patch.createdAt=fmtNow(); patch.lastCrawledAt=null;
      DATA.push(patch);
      closeModal();
      if(platform!==pf){ platform=pf;
        $$('.proto-tab').forEach(function(x){ var on3=x.dataset.platform===pf; x.classList.toggle('active',on3); x.setAttribute('aria-selected',on3?'true':'false'); });
      }
      page=Math.max(1,Math.ceil(rows().length/perPage));
      render(); toast('Add keyword success');
    }
  });

  function fmtNow(){
    var d=new Date(), p=function(n){return (n<10?'0':'')+n;};
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
  }

  /* ---------- delete ---------- */
  function askDelete(id){
    pendingDelete=id;
    var d=DATA.filter(function(x){return x.id===id;})[0];
    $('#del-text').textContent='Are you sure to delete this keyword? ('+d.keyword+' · '+d.platform+')';
    $('#del-mask').classList.add('open');
  }
  function closeDelete(){ $('#del-mask').classList.remove('open'); pendingDelete=null; }
  $('#del-x').addEventListener('click',closeDelete);
  $('#del-cancel').addEventListener('click',closeDelete);
  $('#del-mask').addEventListener('click',function(e){ if(e.target===this) closeDelete(); });
  $('#del-ok').addEventListener('click',function(){
    var id=pendingDelete;
    DATA=DATA.filter(function(d){ return d.id!==id; });
    closeDelete(); render(); toast('Delete keyword success');
  });

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if($('#del-mask').classList.contains('open')) closeDelete();
    else if($('#kw-mask').classList.contains('open')) closeModal();
  });

  window.protoState=function(){ return {platform:platform, page:page, data:DATA}; };
  render();
})();
</script>
